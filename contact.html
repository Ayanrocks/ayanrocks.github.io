<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Send me a ping</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.2">
    <script>
        (function () {
            const theme = localStorage.getItem('theme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
</head>

<body>
    <!-- Page Transition Bars -->
    <div class="transition-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor"></div>

    <!-- 3D Canvas Background -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Technical Borders -->
    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <!-- Edge Navigation -->
    <div class="edge-nav top-left hover-link">
        <a href="index.html">AR.</a>
    </div>
    <div class="edge-nav top-right">
        <button id="theme-toggle" class="hover-link"
            style="background:none; border:none; outline:none; font:inherit; color:inherit; display:flex; align-items:center; gap:0.5rem;">DARK
            / LIGHT <i class="ri-contrast-2-line"></i></button>
        <a href="index.html#projects" class="hover-link" style="display:flex; align-items:center; gap:0.5rem;">PROJECTS
            <i class="ri-archive-line"></i></a>
        <a href="contact.html" class="hover-link"
            style="color: var(--color-primary); display:flex; align-items:center; gap:0.5rem;">CONTACT <i
                class="ri-mail-line"></i></a>
    </div>
    <div class="edge-nav bottom-left">
        <span id="year" class="year"></span> / LATEST.
    </div>

    <!-- Main Content -->
    <div class="smooth-scroll-wrapper">
        <section class="contact-hero section">
            <div class="massive-text" data-speed="0.2">PING.</div>

            <div class="container contact-form-container">
                <span class="section-label" style="display: block; text-align: center; margin-bottom: 4rem;">02 //
                    ESTABLISH_CONNECTION</span>

                <form name="submit-to-google-sheet" class="contact-form">
                    <input type="text" id="name" name="name" class="brutalist-input" required
                        placeholder="NAME / IDENTIFIER">

                    <input type="email" id="email" name="email" class="brutalist-input" required
                        placeholder="EMAIL / COMM_LINK">

                    <textarea id="message" name="message" class="brutalist-input" required
                        placeholder="TRANSMIT MESSAGE..."></textarea>

                    <button type="submit" class="btn btn-primary hover-link" style="width: 100%; margin-top: 2rem;">SEND
                        SECURE PING <i class="ri-send-plane-fill"></i></button>

                    <div id="form-msg" class="form-status"></div>
                </form>
            </div>
        </section>

        <!-- Site Footer -->
        <footer
            style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; border-top: 1px solid var(--border-color); margin: 0 2vw;">
            <p>DESIGNED & ENGINEERED WITH <span style="color: var(--color-primary);">&hearts;</span> BY AYAN BANERJEE
                &copy; <span class="year"></span></p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js?v=1.1"></script>
    <script src="contact.js?v=1.1"></script>
</body>

</html>
